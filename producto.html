<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto · Reymero3d</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="offline-store.js?v=3"></script>
  <script src="cart.js"></script>
  <script src="cart-ui.js"></script>
  <script src="checkout.js"></script>
  <style>
    :root { --bg:#f2eee7; --surface:#fbf8f3; --surface-2:#ece7de; --border:#d9d2c5; --text:#26221d; --muted:#6b6359; --muted-2:#a09688; --accent:#b91c1c; --accent-dark:#991b1b; --shadow:0 1px 0 rgba(38,34,29,0.04); --shadow-lg:0 1px 2px rgba(38,34,29,0.06),0 12px 32px rgba(38,34,29,0.08); }
    body.dark { --bg:#171513; --surface:#211e1a; --surface-2:#2c2721; --border:#443c33; --text:#f5f1ea; --muted:#b8a99a; --muted-2:#8a7e70; --accent:#ef4444; --accent-dark:#dc2626; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 18px 40px rgba(0,0,0,.5); }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Inter","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    body { min-height:100vh; background-image:radial-gradient(circle at 1px 1px, rgba(38,34,29,0.05) 1px, transparent 0); background-size:24px 24px; }
    body.dark { background-image:radial-gradient(circle at 1px 1px, rgba(251,248,243,0.045) 1px, transparent 0); }
    .app { max-width:900px; margin:0 auto; padding:0 1.5rem 4rem; }
    .hero { background:#1c1917; color:#fbf8f3; padding:2rem 2.25rem; margin:1.5rem -1.5rem 0; border-bottom:3px solid var(--accent); }
    .hero h1 { margin:0; font-family:"Fraunces",serif; font-size:2rem; font-weight:700; }
    .hero-nav { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
    .hero-nav a { color:#fbf8f3; text-decoration:none; font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:.35rem .7rem; border:1px solid rgba(251,248,243,0.3); border-radius:2px; font-family:'JetBrains Mono',monospace; }
    .hero-nav a:hover, .hero-nav a.active { background:var(--accent); border-color:var(--accent); }
    .hero-meta { display:flex; flex-direction:column; align-items:flex-end; gap:.8rem; font-family:'JetBrains Mono',monospace; font-size:.72rem; opacity:.85; text-align:right; }
    .theme-toggle { display:inline-flex; align-items:center; gap:.4rem; background:rgba(255,255,255,.06); color:#fbf8f3; border:1px solid rgba(251,248,243,.3); border-radius:99px; padding:.4rem .8rem; font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:600; cursor:pointer; transition:background .15s,border-color .15s; opacity:1; }
    .theme-toggle:hover { background:rgba(255,255,255,.15); border-color:rgba(251,248,243,.6); }
    .detail { display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-top:2rem; }
    @media (max-width:768px) { .detail { grid-template-columns:1fr; } }
    .img { background:var(--surface-2); border-radius:4px; overflow:hidden; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
    .img img { width:100%; height:100%; object-fit:cover; }
    .info h2 { font-family:"Fraunces",serif; font-size:1.8rem; font-weight:700; margin:0 0 .5rem; }
    .cat { font-size:.75rem; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:.5rem; }
    .desc { color:var(--muted); line-height:1.6; margin:1rem 0; }
    .price { font-family:"JetBrains Mono",monospace; font-weight:800; font-size:2rem; color:var(--accent); margin:1rem 0; }
    .stock { font-size:.8rem; color:var(--muted); margin-bottom:1rem; }
    .whatsapp-btn { display:inline-flex; align-items:center; gap:.5rem; background:#25D366; color:#fff; padding:.8rem 1.4rem; border-radius:4px; font-weight:600; font-size:.9rem; text-decoration:none; text-transform:uppercase; letter-spacing:.04em; transition:background .15s; }
    .whatsapp-btn:hover { background:#1ebe57; }
    .cart-add-row { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; margin:1.25rem 0 .5rem; }
    .qty-stepper { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .qty-stepper button { width:2.4rem; height:2.4rem; border:0; background:var(--surface-2); color:var(--text); font-size:1.1rem; cursor:pointer; }
    .qty-stepper span { min-width:2.2rem; text-align:center; font-family:"JetBrains Mono",monospace; font-weight:700; font-size:.9rem; }
    .add-cart-btn { flex:1; min-width:180px; padding:.8rem 1rem; border:1.5px solid var(--accent); border-radius:5px; background:var(--accent); color:#fff; font-family:"JetBrains Mono",monospace; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; cursor:pointer; transition:background .15s,border-color .15s; }
    .add-cart-btn:hover { background:var(--accent-dark); border-color:var(--accent-dark); }
    .add-cart-btn:disabled { opacity:.5; cursor:default; }
    .back { display:inline-block; margin-top:1.5rem; color:var(--accent); text-decoration:none; font-size:.85rem; font-weight:600; }
    .empty { text-align:center; padding:3rem 1rem; color:var(--muted); font-style:italic; }
    .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:#1c1917; color:#fbf8f3; padding:.8rem 1.2rem; border-radius:3px; font-size:.85rem; font-weight:500; box-shadow:var(--shadow-lg); transform:translateY(120%); transition:transform .25s; z-index:50; font-family:"JetBrains Mono",monospace; }
    .toast.show { transform:translateY(0); }
    body.dark .toast { background:#0f0d0b; }
    @media (max-width:640px) { .app { padding:0 1rem 3rem; } .hero { padding:1.5rem 1rem; margin:1rem -1rem 0; } .hero h1 { font-size:1.6rem; } .hero-meta { align-items:flex-start; text-align:left; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="hero-content">
        <div>
          <h1 id="pageTitle">Producto</h1>
          <div class="hero-nav">
            <a href="tienda.html">← Volver al catálogo</a>
          </div>
        </div>
        <div class="hero-meta">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema">☾ Oscuro</button>
          <div>Reymero3d<br>Impresión 3D</div>
        </div>
      </div>
    </div>
    <div id="content"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const SUPABASE_URL = "https://ylpgluuwxegcmubgqvls.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_kJJSRv8NgGjA3AHNHFEtSg_tpCb39bo";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const WHATSAPP = "5491167994767";

    let theme = "light";
    try { theme = localStorage.getItem("reymero-theme") || "light"; } catch (e) {}
    function applyTheme() {
      document.body.classList.toggle("dark", theme === "dark");
      const btn = document.getElementById("themeToggle");
      if (btn) btn.textContent = theme === "dark" ? "☀ Claro" : "☾ Oscuro";
    }
    applyTheme();
    const themeBtn = document.getElementById("themeToggle");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        try { localStorage.setItem("reymero-theme", theme); } catch (e) {}
        applyTheme();
      });
    }

    function money(n) { return "$ " + (Number.isFinite(n)?n:0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

    function escapeHtml(v) {
      return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    let currentProduct = null;
    let detailQty = 1;
    let lastProductUrls = [];
    function renderProduct(data) {
      StoreOffline.revokeObjectUrls(lastProductUrls);
      const rows = StoreOffline.withObjectUrls([data]);
      lastProductUrls = rows;
      const p = rows[0];
      currentProduct = { id: p.id, name: p.name, price: p.price, in_stock: p.in_stock !== false };
      detailQty = 1;
      document.getElementById("pageTitle").textContent = p.name;
      document.title = p.name + " · Reymero3d";
      const img = StoreOffline.imageOf(p);
      document.getElementById("content").innerHTML = `
        <div class="detail">
          <div class="img">${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(p.name)}">` : `<span class="placeholder">Sin foto</span>`}</div>
          <div class="info">
            ${p.category ? `<div class="cat">${escapeHtml(p.category)}</div>` : ""}
            <h2>${escapeHtml(p.name)}</h2>
            ${p.description ? `<div class="desc">${escapeHtml(p.description)}</div>` : ""}
            <div class="price">${money(p.price)}</div>
            <div class="stock">${p.in_stock ? "Disponible" : "Sin stock"}</div>
            <div class="cart-add-row">
              <div class="qty-stepper" role="group" aria-label="Cantidad">
                <button type="button" id="qtyMinus" aria-label="Disminuir cantidad">−</button>
                <span id="qtyValue" aria-live="polite">1</span>
                <button type="button" id="qtyPlus" aria-label="Aumentar cantidad">+</button>
              </div>
              <button type="button" class="add-cart-btn" id="addToCartBtn"${p.in_stock === false ? " disabled" : ""}>${p.in_stock === false ? "Sin stock" : "Agregar al carrito"}</button>
            </div>
            <a class="whatsapp-btn" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola, me interesa el producto: " + p.name + " a " + money(p.price))}" target="_blank">
              Consultar por WhatsApp
            </a>
            <br>
            <a class="back" href="tienda.html">← Volver al catálogo</a>
          </div>
        </div>
      `;

      const minus = document.getElementById("qtyMinus");
      const plus = document.getElementById("qtyPlus");
      const qtyValue = document.getElementById("qtyValue");
      const addBtn = document.getElementById("addToCartBtn");
      if (minus) minus.addEventListener("click", () => { detailQty = Math.max(1, detailQty - 1); if (qtyValue) qtyValue.textContent = String(detailQty); });
      if (plus) plus.addEventListener("click", () => { detailQty = Math.min(999, detailQty + 1); if (qtyValue) qtyValue.textContent = String(detailQty); });
      if (addBtn) addBtn.addEventListener("click", () => {
        if (!currentProduct || currentProduct.in_stock === false) return;
        if (ReymeroCart.add(currentProduct, detailQty)) toast("Agregado al carrito");
        else toast("No se pudo agregar el producto");
      });
    }

    async function loadProduct() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const content = document.getElementById("content");
      if (!id) { content.innerHTML = '<p class="empty">Producto no encontrado.</p>'; return; }

      let cached = null;
      try { cached = await StoreOffline.readOne(id); } catch (e) {}
      if (cached) renderProduct(cached);

      if (!navigator.onLine) {
        if (!cached) content.innerHTML = '<p class="empty">Sin internet y este producto no está guardado. Volvé al catálogo para descargarlo.</p>';
        return;
      }

      try {
        const { data, error } = await sb.from("products").select("*").eq("id", id).eq("published", true).single();
        if (error || !data) throw new Error(error ? error.message : "Producto no encontrado o no disponible");
        let toRender = data;
        try { toRender = await StoreOffline.upsert(data); StoreOffline.setLastSync(Date.now()); } catch (e) {}
        renderProduct(toRender);
      } catch (e) {
        if (!cached) content.innerHTML = '<p class="empty">No se pudo cargar el producto. ' + escapeHtml(e.message || "") + '</p>';
      }
    }
    loadProduct();
  </script>
</body>
</html>
