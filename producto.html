<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto · Reymero3d</title>
  <meta name="description" content="Detalle de producto de Reymero 3D: fotos, precio, disponibilidad y consulta por WhatsApp." />
  <meta name="theme-color" content="#1c1917" />
  <meta property="og:site_name" content="Reymero 3D" />
  <meta property="og:type" content="product" />
  <meta property="og:title" content="Producto · Reymero 3D" />
  <meta property="og:description" content="Mirá el detalle, precio y disponibilidad de este producto impreso en 3D." />
  <meta property="og:image" content="logo.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="offline-store.js?v=3"></script>
  <script src="cart.js"></script>
  <script src="cart-ui.js"></script>
  <script src="customer.js"></script>
  <script src="checkout.js"></script>
  <script src="order.js"></script>
  <script src="share.js"></script>
  <script src="jspdf.umd.min.js"></script>
  <script src="receipt.js"></script>
  <style>
    :root { --bg:#f2eee7; --surface:#fbf8f3; --surface-2:#ece7de; --border:#d9d2c5; --text:#26221d; --muted:#6b6359; --muted-2:#a09688; --accent:#b91c1c; --accent-dark:#991b1b; --shadow:0 1px 0 rgba(38,34,29,0.04); --shadow-lg:0 1px 2px rgba(38,34,29,0.06),0 12px 32px rgba(38,34,29,0.08); }
    body.dark { --bg:#171513; --surface:#211e1a; --surface-2:#2c2721; --border:#443c33; --text:#f5f1ea; --muted:#b8a99a; --muted-2:#8a7e70; --accent:#ef4444; --accent-dark:#dc2626; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 18px 40px rgba(0,0,0,.5); }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Inter","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    body { min-height:100vh; background-image:radial-gradient(circle at 1px 1px, rgba(38,34,29,0.05) 1px, transparent 0); background-size:24px 24px; }
    body.dark { background-image:radial-gradient(circle at 1px 1px, rgba(251,248,243,0.045) 1px, transparent 0); }
    .app { max-width:900px; margin:0 auto; padding:0 1.5rem 4rem; }
    .hero { background:#1c1917; color:#fbf8f3; padding:2rem 2.25rem; margin:1.5rem -1.5rem 0; border-bottom:3px solid var(--accent); }
    .hero h1 { margin:0; font-family:"Fraunces",serif; font-size:2rem; font-weight:700; }
    .hero-nav { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
    .hero-nav a { color:#fbf8f3; text-decoration:none; font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:.35rem .7rem; border:1px solid rgba(251,248,243,0.3); border-radius:2px; font-family:'JetBrains Mono',monospace; }
    .hero-nav a:hover, .hero-nav a.active { background:var(--accent); border-color:var(--accent); }
    .hero-meta { display:flex; flex-direction:column; align-items:flex-end; gap:.8rem; font-family:'JetBrains Mono',monospace; font-size:.72rem; opacity:.85; text-align:right; }
    .theme-toggle { display:inline-flex; align-items:center; gap:.4rem; background:rgba(255,255,255,.06); color:#fbf8f3; border:1px solid rgba(251,248,243,.3); border-radius:99px; padding:.4rem .8rem; font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:600; cursor:pointer; transition:background .15s,border-color .15s; opacity:1; }
    .theme-toggle:hover { background:rgba(255,255,255,.15); border-color:rgba(251,248,243,.6); }
    .detail { display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-top:2rem; }
    @media (max-width:768px) { .detail { grid-template-columns:1fr; } }
    .img { background:var(--surface-2); border-radius:4px; overflow:hidden; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
    .img img { width:100%; height:100%; object-fit:cover; }
    .info h2 { font-family:"Fraunces",serif; font-size:1.8rem; font-weight:700; margin:0 0 .5rem; }
    .cat { font-size:.75rem; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:.5rem; }
    .desc { color:var(--muted); line-height:1.6; margin:1rem 0; }
    .price { font-family:"JetBrains Mono",monospace; font-weight:800; font-size:2rem; color:var(--accent); margin:1rem 0; }
    .stock { font-size:.8rem; color:var(--muted); margin-bottom:1rem; }
    .whatsapp-btn { display:inline-flex; align-items:center; gap:.5rem; background:#25D366; color:#fff; padding:.8rem 1.4rem; border-radius:4px; font-weight:600; font-size:.9rem; text-decoration:none; text-transform:uppercase; letter-spacing:.04em; transition:background .15s; }
    .whatsapp-btn:hover { background:#1ebe57; }
    .action-row { display:flex; flex-wrap:wrap; gap:.75rem; margin-top:.5rem; }
    .share-btn { display:inline-flex; align-items:center; gap:.5rem; background:var(--surface); color:var(--text); padding:.8rem 1.1rem; border-radius:4px; font-weight:600; font-size:.85rem; text-decoration:none; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--border); cursor:pointer; font-family:inherit; }
    .share-btn:hover { border-color:var(--accent); color:var(--accent); }
    .share-story-btn { display:none; align-items:center; gap:.5rem; background:#1c1917; color:#fbf8f3; padding:.8rem 1.1rem; border-radius:4px; font-weight:600; font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; border:1px solid #1c1917; cursor:pointer; font-family:inherit; }
    .share-story-btn:hover { background:var(--accent); border-color:var(--accent); }
    .share-story-btn.visible { display:inline-flex; }
    .cart-add-row { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; margin:1.25rem 0 .5rem; }
    .qty-stepper { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .qty-stepper button { width:2.4rem; height:2.4rem; border:0; background:var(--surface-2); color:var(--text); font-size:1.1rem; cursor:pointer; }
    .qty-stepper span { min-width:2.2rem; text-align:center; font-family:"JetBrains Mono",monospace; font-weight:700; font-size:.9rem; }
    .add-cart-btn { flex:1; min-width:180px; padding:.8rem 1rem; border:1.5px solid var(--accent); border-radius:5px; background:var(--accent); color:#fff; font-family:"JetBrains Mono",monospace; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; cursor:pointer; transition:background .15s,border-color .15s; }
    .add-cart-btn:hover { background:var(--accent-dark); border-color:var(--accent-dark); }
    .add-cart-btn:disabled { opacity:.5; cursor:default; }
    .mobile-cart-bar { display:none; position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--border); padding:.75rem 5rem calc(.75rem + env(safe-area-inset-bottom, 0px)) 1rem; box-shadow:0 -8px 24px rgba(0,0,0,.08); gap:.75rem; align-items:center; }
    .mobile-cart-bar .price { margin:0; font-size:1.2rem; }
    .mobile-cart-bar .add-cart-btn { min-width:0; }
    @media (max-width:768px) { .mobile-cart-bar { display:flex; } .app { padding-bottom:6.5rem; } }
    .back { display:inline-block; margin-top:1.5rem; color:var(--accent); text-decoration:none; font-size:.85rem; font-weight:600; }
    .empty { text-align:center; padding:3rem 1rem; color:var(--muted); font-style:italic; }
    .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:#1c1917; color:#fbf8f3; padding:.8rem 1.2rem; border-radius:3px; font-size:.85rem; font-weight:500; box-shadow:var(--shadow-lg); transform:translateY(120%); transition:transform .25s; z-index:50; font-family:"JetBrains Mono",monospace; }
    .toast.show { transform:translateY(0); }
    body.dark .toast { background:#0f0d0b; }
    @media (max-width:640px) { .app { padding:0 1rem 3rem; } .hero { padding:1.5rem 1rem; margin:1rem -1rem 0; } .hero h1 { font-size:1.6rem; } .hero-meta { align-items:flex-start; text-align:left; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="hero-content">
        <div>
          <h1 id="pageTitle">Producto</h1>
          <div class="hero-nav">
            <a href="tienda.html">← Volver al catálogo</a>
          </div>
        </div>
        <div class="hero-meta">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema">☾ Oscuro</button>
          <button class="theme-toggle" id="accountBtn" type="button" aria-label="Mi cuenta">Mi cuenta</button>
          <div>Reymero3d<br>Impresión 3D</div>
        </div>
      </div>
    </div>
    <div id="content"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
    const SUPABASE_URL = "https://ylpgluuwxegcmubgqvls.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_kJJSRv8NgGjA3AHNHFEtSg_tpCb39bo";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const WHATSAPP = "5491167994767";

    let theme = "light";
    try { theme = localStorage.getItem("reymero-theme") || "light"; } catch (e) {}
    function applyTheme() {
      document.body.classList.toggle("dark", theme === "dark");
      const btn = document.getElementById("themeToggle");
      if (btn) btn.textContent = theme === "dark" ? "☀ Claro" : "☾ Oscuro";
    }
    applyTheme();
    const themeBtn = document.getElementById("themeToggle");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        try { localStorage.setItem("reymero-theme", theme); } catch (e) {}
        applyTheme();
      });
    }

    const accountBtn = document.getElementById("accountBtn");
    function updateAccountBtn() {
      if (!accountBtn || !window.ReymeroCustomer) return;
      const user = window.ReymeroCustomer.getUser();
      accountBtn.textContent = user ? "Mi cuenta" : "Ingresar";
    }
    if (accountBtn) accountBtn.addEventListener("click", () => { if (window.ReymeroCustomer) window.ReymeroCustomer.open(); });
    if (window.ReymeroCustomer) { window.ReymeroCustomer.init().then(updateAccountBtn); window.ReymeroCustomer.subscribe(updateAccountBtn); }

    let isProductAdmin = false;
    function updateAdminStoryBtn() {
      const btn = document.getElementById("shareStoryBtn");
      if (btn) btn.classList.toggle("visible", !!isProductAdmin);
    }
    async function checkProductAdmin() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) { isProductAdmin = false; updateAdminStoryBtn(); return; }
        const { data, error } = await sb.rpc("is_admin");
        isProductAdmin = !error && data === true;
      } catch (e) {
        isProductAdmin = false;
      }
      updateAdminStoryBtn();
    }
    checkProductAdmin();
    if (window.ReymeroCustomer) window.ReymeroCustomer.subscribe(() => { checkProductAdmin(); updateAccountBtn(); });

    function money(n) { return "$ " + (Number.isFinite(n)?n:0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

    function escapeHtml(v) {
      return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    let currentProduct = null;
    let detailQty = 1;
    let lastProductUrls = [];
    let detailMediaTimer = null;
    function renderProduct(data) {
      if (detailMediaTimer) { clearInterval(detailMediaTimer); detailMediaTimer = null; }
      StoreOffline.revokeObjectUrls(lastProductUrls);
      const rows = StoreOffline.withObjectUrls([data]);
      lastProductUrls = rows;
      const p = rows[0];
      currentProduct = { id: p.id, name: p.name, price: p.price, in_stock: p.in_stock !== false };
      detailQty = 1;
      document.getElementById("pageTitle").textContent = p.name;
      document.title = p.name + " · Reymero3d";
      const primary = StoreOffline.imageOf(p);
      const media = Array.isArray(p.media) && p.media.length ? p.media.slice(0, 5) : (primary ? [{type:'image',url:primary}] : []);
      const slidesHtml = media.length ? media.map((m, i) => {
        const active = i === 0 ? 'opacity:1;z-index:1;' : 'opacity:0;z-index:0;';
        if (m.type === 'video') return `<div class="detail-slide" data-idx="${i}" data-type="video" style="position:absolute;inset:0;${active}transition:opacity .45s ease;display:flex;align-items:center;justify-content:center;background:#000;"><video src="${escapeHtml(m.url)}" controls playsinline autoplay muted style="width:100%;height:100%;object-fit:contain;background:#000"></video></div>`;
        return `<div class="detail-slide" data-idx="${i}" style="position:absolute;inset:0;${active}transition:opacity .45s ease;"><img src="${escapeHtml(m.url)}" alt="${escapeHtml(p.name)}" style="width:100%;height:100%;object-fit:cover;"></div>`;
      }).join('') : `<span class="placeholder">Sin foto</span>`;
      const dotsHtml = media.length > 1 ? `<div id="detailDots" style="position:absolute;left:0;right:0;bottom:.75rem;display:flex;gap:.4rem;justify-content:center;z-index:3;">${media.map((_,i)=>`<button type="button" class="detail-dot" data-idx="${i}" aria-label="Ver imagen ${i+1}" style="width:10px;height:10px;border-radius:50%;border:0;padding:0;cursor:pointer;background:${i===0?'#fff':'rgba(255,255,255,.45)'};box-shadow:0 0 0 1px rgba(0,0,0,.2);"></button>`).join('')}</div>` : '';
      const mediaHtml = media.length ? `<div id="detailCarousel" style="position:relative;width:100%;height:100%;min-height:360px;">${slidesHtml}${dotsHtml}</div>` : `<span class="placeholder">Sin foto</span>`;
      document.getElementById("content").innerHTML = `
        <div class="detail">
          <div class="img" style="padding:0;overflow:hidden;position:relative;min-height:360px;">${mediaHtml}</div>
          <div class="info">
            ${p.category ? `<div class="cat">${escapeHtml(p.category)}</div>` : ""}
            <h2>${escapeHtml(p.name)}</h2>
            ${p.description ? `<div class="desc">${escapeHtml(p.description)}</div>` : ""}
            <div class="price">${money(p.price)}</div>
            <div class="stock">${p.in_stock ? "Disponible" : "Sin stock"}</div>
            <div class="cart-add-row">
              <div class="qty-stepper" role="group" aria-label="Cantidad">
                <button type="button" id="qtyMinus" aria-label="Disminuir cantidad">−</button>
                <span id="qtyValue" aria-live="polite">1</span>
                <button type="button" id="qtyPlus" aria-label="Aumentar cantidad">+</button>
              </div>
              <button type="button" class="add-cart-btn" id="addToCartBtn"${p.in_stock === false ? " disabled" : ""}>${p.in_stock === false ? "Sin stock" : "Agregar al carrito"}</button>
            </div>
            <div class="action-row">
              <a class="whatsapp-btn" id="waBtn" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola, me interesa el producto: " + p.name + " - " + money(p.price) + "\n" + location.href)}" target="_blank" rel="noopener noreferrer">
                Consultar por WhatsApp
              </a>
              <button type="button" class="share-btn" id="shareProductBtn">Compartir</button>
              <button type="button" class="share-story-btn" id="shareStoryBtn" aria-label="Compartir en historia de WhatsApp (solo admin)">Compartir en historia</button>
            </div>
            <a class="back" href="tienda.html">← Volver al catálogo</a>
          </div>
        </div>
        <div class="mobile-cart-bar" id="mobileCartBar">
          <div class="price" style="font-size:1.1rem;white-space:nowrap;">${money(p.price)}</div>
          <button type="button" class="add-cart-btn" id="addToCartBtnMobile"${p.in_stock === false ? " disabled" : ""}>${p.in_stock === false ? "Sin stock" : "Agregar al carrito"}</button>
        </div>
      `;

      const minus = document.getElementById("qtyMinus");
      const plus = document.getElementById("qtyPlus");
      const qtyValue = document.getElementById("qtyValue");
      const addBtn = document.getElementById("addToCartBtn");
      if (minus) minus.addEventListener("click", () => { detailQty = Math.max(1, detailQty - 1); if (qtyValue) qtyValue.textContent = String(detailQty); });
      if (plus) plus.addEventListener("click", () => { detailQty = Math.min(999, detailQty + 1); if (qtyValue) qtyValue.textContent = String(detailQty); });
      const addToCart = () => {
        if (!currentProduct || currentProduct.in_stock === false) return;
        if (ReymeroCart.add(currentProduct, detailQty)) toast("Agregado al carrito");
        else toast("No se pudo agregar el producto");
      };
      if (addBtn) addBtn.addEventListener("click", addToCart);
      const addBtnMobile = document.getElementById("addToCartBtnMobile");
      if (addBtnMobile) addBtnMobile.addEventListener("click", addToCart);

      const shareBtn = document.getElementById("shareProductBtn");
      if (shareBtn) shareBtn.addEventListener("click", async () => {
        const url = location.href;
        const title = p.name + " · Reymero 3D";
        const text = p.name + " - " + money(p.price) + "\n" + url;
        if (window.ReymeroShare && window.ReymeroShare.shareText) {
          const shared = await window.ReymeroShare.shareText(text, title);
          if (shared) return;
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(url);
            toast("Enlace copiado");
            return;
          }
        } catch (e) {}
        window.prompt("Copiá este enlace:", url);
      });

      updateAdminStoryBtn();
      const shareStoryBtn = document.getElementById("shareStoryBtn");
      if (shareStoryBtn) shareStoryBtn.addEventListener("click", async () => {
        if (!isProductAdmin) return;
        const url = location.href;
        const title = p.name + " · Reymero 3D";
        const text = p.name + " - " + money(p.price) + "\n" + url;
        shareStoryBtn.disabled = true;
        const oldLabel = shareStoryBtn.textContent;
        shareStoryBtn.textContent = "Preparando...";
        try {
          let blob = null;
          const imgUrl = primary || (media.find(m => m.type === 'image') || {}).url || "";
          if (imgUrl) {
            try {
              const r = await fetch(imgUrl, { mode: "cors" });
              if (r.ok) blob = await r.blob();
            } catch (e) {}
          }
          if (!blob && window.StoreOffline && typeof window.StoreOffline.readOne === "function") {
            try {
              const cached = await window.StoreOffline.readOne(p.id);
              if (cached && cached.imageBlob instanceof Blob) blob = cached.imageBlob;
              if (!blob && cached && cached.imageDataUrl) {
                const res = await fetch(cached.imageDataUrl);
                blob = await res.blob();
              }
            } catch (e) {}
          }
          if (blob) {
            const ext = (blob.type && blob.type.split("/")[1]) ? blob.type.split("/")[1].replace("jpeg","jpg") : "jpg";
            const filename = (p.name || "producto").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "producto";
            if (window.ReymeroShare && window.ReymeroShare.shareFile) {
              await window.ReymeroShare.shareFile(blob, filename + "." + ext, blob.type || "image/jpeg", text, title, "Imagen descargada. Subila a tu estado de WhatsApp.");
            } else {
              window.ReymeroShare.download(blob, filename + "." + ext);
              toast("Imagen descargada. Subila a tu estado de WhatsApp.");
            }
          } else {
            if (window.ReymeroShare && window.ReymeroShare.shareText) await window.ReymeroShare.shareText(text, title);
            else { await navigator.clipboard.writeText(text); toast("Texto copiado"); }
            toast("No se pudo obtener la imagen, se compartió el texto.");
          }
        } catch (e) {
          console.warn("share story", e);
          toast("No se pudo compartir la historia");
        } finally {
          shareStoryBtn.disabled = false;
          shareStoryBtn.textContent = oldLabel;
        }
      });

      try {
        const desc = (p.description ? String(p.description).slice(0, 160) : (p.name + " - " + money(p.price) + " en Reymero 3D"));
        document.querySelector('meta[name="description"]')?.setAttribute("content", desc);
        document.querySelector('meta[property="og:title"]')?.setAttribute("content", p.name + " · Reymero 3D");
        document.querySelector('meta[property="og:description"]')?.setAttribute("content", desc);
        document.querySelector('meta[property="og:image"]')?.setAttribute("content", primary || "logo.svg");
        let canon = document.querySelector('link[rel="canonical"]');
        if (!canon) { canon = document.createElement('link'); canon.rel = 'canonical'; document.head.appendChild(canon); }
        canon.href = location.href;
      } catch (e) {}

      const slides = Array.from(document.querySelectorAll(".detail-slide"));
      const dots = Array.from(document.querySelectorAll(".detail-dot"));
      const carousel = document.getElementById("detailCarousel");
      let slideIdx = 0;
      function clearMediaTimer() { if (detailMediaTimer) { clearTimeout(detailMediaTimer); detailMediaTimer = null; } }
      function scheduleNext() {
        clearMediaTimer();
        const active = slides[slideIdx];
        const video = active ? active.querySelector("video") : null;
        if (video) {
          video.muted = true;
          video.defaultMuted = true;
          video.playsInline = true;
          video.setAttribute("muted", "");
          video.setAttribute("playsinline", "");
          const startVideo = () => {
            if (slides[slideIdx] !== active) return;
            try { video.currentTime = 0; } catch (_) {}
            const p = video.play();
            if (p && p.catch) p.catch(() => {});
          };
          if (video._startVideo) video.removeEventListener("loadeddata", video._startVideo);
          video._startVideo = startVideo;
          if (video.readyState >= 2) startVideo();
          else {
            video.addEventListener("loadeddata", startVideo, { once: true });
            video.load();
          }
          video.onended = () => { if (slides[slideIdx] === active && slides.length > 1) showSlide(slideIdx + 1); };
        } else if (slides.length > 1) {
          detailMediaTimer = setTimeout(() => showSlide(slideIdx + 1), 3000);
        }
      }
      function showSlide(next) {
        if (!slides.length) return;
        slideIdx = (next + slides.length) % slides.length;
        slides.forEach((s, i) => {
          const active = i === slideIdx;
          s.style.opacity = active ? "1" : "0";
          s.style.zIndex = active ? "1" : "0";
          const v = s.querySelector("video");
          if (v && !active) {
            if (v._startVideo) { v.removeEventListener("loadeddata", v._startVideo); v._startVideo = null; }
            v.pause();
            v.onended = null;
          }
        });
        dots.forEach((d, i) => { d.style.background = i === slideIdx ? "#fff" : "rgba(255,255,255,.45)"; });
        scheduleNext();
      }
      dots.forEach(d => d.addEventListener("click", () => { showSlide(Number(d.dataset.idx || 0)); }));
      if (carousel && slides.length > 1) {
        let startX = null;
        carousel.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
        carousel.addEventListener("touchend", (e) => {
          if (startX == null) return;
          const dx = e.changedTouches[0].clientX - startX;
          if (Math.abs(dx) > 40) showSlide(slideIdx + (dx < 0 ? 1 : -1));
          startX = null;
        }, { passive: true });
        let mouseDownX = null;
        carousel.addEventListener("mousedown", (e) => { mouseDownX = e.clientX; });
        carousel.addEventListener("mouseup", (e) => {
          if (mouseDownX == null) return;
          const dx = e.clientX - mouseDownX;
          if (Math.abs(dx) > 40) showSlide(slideIdx + (dx < 0 ? 1 : -1));
          mouseDownX = null;
        });
      }
      if (carousel) {
        const tryPlayActiveVideo = () => {
          const v = slides[slideIdx] && slides[slideIdx].querySelector("video");
          if (v && v.paused) { v.muted = true; v.play().catch(() => {}); }
        };
        carousel.addEventListener("pointerdown", tryPlayActiveVideo, { passive: true });
      }
      if (slides.length > 1) showSlide(0);
      else if (slides.length === 1) scheduleNext();
    }

    async function loadProduct() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const content = document.getElementById("content");
      if (!id) { content.innerHTML = '<p class="empty">Producto no encontrado.</p>'; return; }

      let cached = null;
      try { cached = await StoreOffline.readOne(id); } catch (e) {}
      if (cached) renderProduct(cached);

      if (!navigator.onLine) {
        if (!cached) content.innerHTML = '<p class="empty">Sin internet y este producto no está guardado. Volvé al catálogo para descargarlo.</p>';
        return;
      }

      try {
        const { data, error } = await sb.from("products").select("*").eq("id", id).eq("published", true).single();
        if (error || !data) throw new Error(error ? error.message : "Producto no encontrado o no disponible");
        let toRender = data;
        try { toRender = await StoreOffline.upsert(data); StoreOffline.setLastSync(Date.now()); } catch (e) {}
        renderProduct(toRender);
      } catch (e) {
        if (!cached) content.innerHTML = '<p class="empty">No se pudo cargar el producto. ' + escapeHtml(e.message || "") + '</p>';
      }
    }
    loadProduct();
  </script>
</body>
