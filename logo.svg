<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" role="img" aria-label="Reymero3D">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Badge con impresora 3D estilo Prusa MK4 (genérica, sin marca) -->
  <g transform="translate(8,8)">
    <rect x="0" y="0" width="74" height="74" rx="16" fill="url(#badge)"/>

    <!-- Marco de aluminio -->
    <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="14" y1="8" x2="14" y2="62"/>
      <line x1="60" y1="8" x2="60" y2="62"/>
      <line x1="14" y1="8" x2="60" y2="8"/>
    </g>

    <!-- Eje X + carro del extrusor (Nextruder) -->
    <rect x="24" y="12" width="26" height="12" rx="3" fill="#ffffff" stroke="none"/>
    <rect x="28" y="15" width="6" height="6" rx="1" fill="#0f766e" stroke="none"/>
    <rect x="38" y="15" width="6" height="6" rx="1" fill="#0f766e" stroke="none"/>
    <!-- Boquilla -->
    <line x1="37" y1="24" x2="37" y2="34" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Cama magnética (con textura) -->
    <rect x="17" y="40" width="40" height="7" rx="2" fill="#ffffff" stroke="none"/>
    <g stroke="#0f766e" stroke-width="0.9" opacity="0.5">
      <line x1="21" y1="42" x2="21" y2="45"/>
      <line x1="27" y1="42" x2="27" y2="45"/>
      <line x1="33" y1="42" x2="33" y2="45"/>
      <line x1="39" y1="42" x2="39" y2="45"/>
      <line x1="45" y1="42" x2="45" y2="45"/>
      <line x1="51" y1="42" x2="51" y2="45"/>
    </g>

    <!-- Base con electrónica y pantalla -->
    <rect x="10" y="54" width="54" height="12" rx="3" fill="#ffffff" stroke="none" opacity="0.9"/>
    <rect x="16" y="57" width="16" height="6" rx="1.5" fill="#0f766e" stroke="none"/>
    <rect x="36" y="58" width="22" height="4" rx="1" fill="#0f766e" stroke="none" opacity="0.6"/>
  </g>

  <!-- Wordmark -->
  <text x="92" y="46" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Reymero</text>
  <text x="236" y="46" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" fill="#ea580c" letter-spacing="-0.5">3D</text>
  <text x="92" y="66" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#78716c" letter-spacing="2">IMPRESIÓN 3D · PRESUPUESTOS</text>
</svg>
