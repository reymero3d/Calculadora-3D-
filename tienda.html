<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda · Reymero3d</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#f2eee7; --surface:#fbf8f3; --surface-2:#ece7de; --border:#d9d2c5; --text:#26221d; --muted:#6b6359; --muted-2:#a09688; --accent:#b91c1c; --accent-dark:#991b1b; --amber:#a16207; --shadow:0 1px 0 rgba(38,34,29,0.04); --shadow-lg:0 1px 2px rgba(38,34,29,0.06),0 12px 32px rgba(38,34,29,0.08); }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Inter","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    body { min-height:100vh; background-image:radial-gradient(circle at 1px 1px, rgba(38,34,29,0.05) 1px, transparent 0); background-size:24px 24px; }
    .app { max-width:1240px; margin:0 auto; padding:0 1.5rem 4rem; }
    .hero { background:#1c1917; color:#fbf8f3; padding:2.5rem 2.25rem 2.25rem; margin:1.5rem -1.5rem 0; position:relative; overflow:hidden; border-bottom:3px solid var(--accent); }
    .hero::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(251,248,243,0.04) 39px, rgba(251,248,243,0.04) 40px); }
    .hero h1 { margin:0; font-family:"Fraunces",serif; font-size:2.6rem; font-weight:700; letter-spacing:-0.02em; line-height:1.05; }
    .hero p { margin:.5rem 0 0; opacity:.75; font-size:1rem; max-width:520px; }
    .hero-nav { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
    .hero-nav a { color:#fbf8f3; text-decoration:none; font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:.35rem .7rem; border:1px solid rgba(251,248,243,0.3); border-radius:2px; font-family:'JetBrains Mono',monospace; }
    .hero-nav a:hover, .hero-nav a.active { background:var(--accent); border-color:var(--accent); }
    .hero-meta { font-family:"JetBrains Mono",monospace; font-size:.75rem; opacity:.6; text-align:right; line-height:1.6; }
    .search-bar { display:flex; gap:.5rem; margin-top:1.5rem; flex-wrap:wrap; }
    .search-bar input, .search-bar select { flex:1; min-width:140px; padding:.6rem .8rem; border:1.5px solid var(--border); border-radius:3px; background:var(--surface); color:var(--text); font-size:.9rem; }
    .catalog { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1.25rem; margin-top:1.5rem; }
    .prod-card { background:var(--surface); border:1px solid var(--border); border-radius:4px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; text-decoration:none; color:inherit; transition:transform .15s, box-shadow .15s; }
    .prod-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
    .prod-card .img { background:var(--surface-2); height:200px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .prod-card .img img { width:100%; height:100%; object-fit:cover; }
    .prod-card .img .placeholder { color:var(--muted-2); font-size:.8rem; font-style:italic; }
    .prod-card .body { padding:1rem; flex:1; display:flex; flex-direction:column; gap:.4rem; }
    .prod-card .name { font-family:"Fraunces",serif; font-weight:700; font-size:1.1rem; margin:0; }
    .prod-card .cat { font-size:.7rem; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
    .prod-card .desc { font-size:.8rem; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .prod-card .price { font-family:"JetBrains Mono",monospace; font-weight:800; font-size:1.3rem; color:var(--accent); margin-top:.4rem; }
    .prod-card .stock { font-size:.7rem; color:var(--muted-2); }
    .empty { text-align:center; padding:3rem 1rem; color:var(--muted); font-style:italic; }
    .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:#1c1917; color:#fbf8f3; padding:.8rem 1.2rem; border-radius:3px; font-size:.85rem; font-weight:500; box-shadow:var(--shadow-lg); transform:translateY(120%); transition:transform .25s; z-index:50; font-family:"JetBrains Mono",monospace; }
    .toast.show { transform:translateY(0); }
    .whatsapp-btn { display:inline-flex; align-items:center; gap:.5rem; background:#25D366; color:#fff; padding:.7rem 1.2rem; border-radius:4px; font-weight:600; font-size:.85rem; text-decoration:none; text-transform:uppercase; letter-spacing:.04em; transition:background .15s; }
    .whatsapp-btn:hover { background:#1ebe57; }
    @media (max-width:640px) {
      .app { padding:0 1rem 3rem; }
      .hero { padding:1.5rem 1rem; margin:1rem -1rem 0; }
      .hero h1 { font-size:1.8rem; }
      .hero-meta { text-align:left; }
      .catalog { grid-template-columns:1fr; }
      .search-bar { flex-direction:column; }
      .search-bar input, .search-bar select { width:100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="hero-content">
        <div>
          <h1>Catálogo</h1>
          <p>Productos impresos en 3D. Consultá por WhatsApp.</p>
          <div class="hero-nav">
            <a href="index.html">Costos 3D</a>
            <a href="tienda.html" class="active">Tienda</a>
          </div>
        </div>
        <div class="hero-meta">Reymero3d<br>Impresión 3D</div>
      </div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar producto...">
      <select id="categoryFilter"><option value="">Todas las categorías</option></select>
    </div>
    <div class="catalog" id="catalog"></div>
    <div class="empty" id="emptyMsg" style="display:none;">No hay productos disponibles por el momento.</div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const SUPABASE_URL = "https://ylpgluuwxegcmubgqvls.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_kJJSRv8NgGjA3AHNHFEtSg_tpCb39bo";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const WHATSAPP = "5491167994767";

    function money(n, code) { return "$ " + (Number.isFinite(n)?n:0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

    function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

    let products = [];
    let searchTerm = "";
    let categoryFilter = "";

    async function loadProducts() {
      const { data, error } = await sb.from("products").select("id,name,description,category,price,image_url,published,in_stock").eq("published", true).eq("in_stock", true).order("name");
      if (error) {
        console.error(error);
        document.getElementById("emptyMsg").textContent = "No se pudo cargar el catálogo. Error: " + error.message;
        document.getElementById("emptyMsg").style.display = "block";
        return;
      }
      products = data || [];
      render();
    }

    function render() {
      const cf = document.getElementById("categoryFilter");
      if (cf) {
        const cats = [...new Set(products.map(p => p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
        const cur = cf.value;
        cf.innerHTML = '<option value="">Todas las categorías</option>' + cats.map(c => '<option value="'+c+'">'+c+'</option>').join("");
        if (cur && cats.includes(cur)) cf.value = cur;
      }
      const filtered = products.filter(p => {
        const matchSearch = !searchTerm || (p.name||"").toLowerCase().includes(searchTerm.toLowerCase()) || (p.description||"").toLowerCase().includes(searchTerm.toLowerCase());
        const matchCat = !categoryFilter || p.category === categoryFilter;
        return matchSearch && matchCat;
      });
      const catalog = document.getElementById("catalog");
      const empty = document.getElementById("emptyMsg");
      if (filtered.length === 0) {
        catalog.innerHTML = "";
        empty.style.display = "block";
      } else {
        empty.style.display = "none";
        catalog.innerHTML = filtered.map(p => `
          <a class="prod-card" href="producto.html?id=${p.id}">
            <div class="img">${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : `<span class="placeholder">Sin foto</span>`}</div>
            <div class="body">
              ${p.category ? `<div class="cat">${p.category}</div>` : ""}
              <h3 class="name">${p.name}</h3>
              ${p.description ? `<div class="desc">${p.description}</div>` : ""}
              <div class="price">${money(p.price)}</div>
              <div class="stock">Disponible</div>
            </div>
          </a>
        `).join("");
      }
    }

    document.getElementById("searchInput").addEventListener("input", (e) => { searchTerm = e.target.value; render(); });
    document.getElementById("categoryFilter").addEventListener("change", (e) => { categoryFilter = e.target.value; render(); });

    loadProducts();
  </script>
</body>
</html>
